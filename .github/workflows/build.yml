
name: Build CrossDrop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dependances
        run: npm ci

      - name: Construire CrossDrop Windows
        run: npx electron-builder --win nsis

      - name: Publier le fichier EXE
        uses: actions/upload-artifact@v4
        with:
          name: CrossDrop-Windows
          path: dist/*.exe

  build-mac:
    runs-on: macos-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dependances
        run: npm ci

      - name: Construire CrossDrop Mac
        run: npx electron-builder --mac dmg

      - name: Publier le fichier DMG
        uses: actions/upload-artifact@v4
        with:
          name: CrossDrop-Mac
          path: dist/*.dmg
