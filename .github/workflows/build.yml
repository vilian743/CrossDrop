
name: Build CrossDrop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Installer les dependances
        run: npm ci

      - name: Construire CrossDrop Windows
        run: npx electron-builder --win nsis --publish never

      - name: Publier le EXE
        uses: actions/upload-artifact@v7
        with:
          name: CrossDrop-Windows
          path: dist/*.exe
          if-no-files-found: error

  build-mac:
    name: Build Mac
    runs-on: macos-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Installer les dependances
        run: npm ci

      - name: Construire CrossDrop Mac
        run: npx electron-builder --mac dmg --publish never

      - name: Publier le DMG
        uses: actions/upload-artifact@v7
        with:
          name: CrossDrop-Mac
          path: dist/*.dmg
          if-no-files-found: error
